<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us pad around the iPhone notch and home bar with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches the page background so the iOS status bar blends in (updated on theme change) -->
    <meta name="theme-color" content="#f2f2f7" />
    <!-- Apply the saved or device appearance before first paint: no white flash in dark mode -->
    <script>
      try {
        var pref = localStorage.getItem('astera-theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <meta name="description" content="Astera Studio: ask questions about your data, pin answers to dashboards, and keep the pipelines behind them healthy from any device." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316202A'/%3E%3Cpath d='M9 11h6a3 3 0 0 1 3 3v4a3 3 0 0 0 3 3h2' fill='none' stroke='%23F4F6F7' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='11' r='2.5' fill='%23F4F6F7'/%3E%3Ccircle cx='23' cy='21' r='2.5' fill='%23F4F6F7'/%3E%3C/svg%3E" />
    <title>Astera Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
